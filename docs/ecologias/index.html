<title>Ecologias da Percepção Jardim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: mundo 3D em tela cheia; interface mínima nas bordas, como sinalização de sala expositiva */
:root{
  --void:#050704; --ink:#eceee4; --mute:#9fa596; --acid:#b8f23c; --heat:#ff6b2c; --glass:rgba(5,7,4,.72);
  --display:'Syne','Arial Black',Arial,sans-serif; --mono:'Space Mono','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--void);color:var(--ink);font-family:var(--mono)}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:2}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,40px);line-height:.9;letter-spacing:-.02em;text-transform:uppercase;color:var(--acid)}
.brand p{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
button{font:700 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--glass);border:1px solid #3a4033;padding:10px 12px;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:var(--acid);color:var(--acid)}
button:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--acid);color:var(--void);background:var(--acid)}
#vr{border-color:var(--heat);color:var(--heat)}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;z-index:2;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
nav{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.hint{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acid);z-index:2;text-align:center;max-width:calc(100% - 32px)}
@media (max-width:520px){.hint,.brand p{display:none}}
</style>

<header class="top">
  <div class="brand">
    <h1>Ecologias<br>da Percepção</h1>
    <p>Jardim · mundo gerado no Marble, animado ao vivo</p>
  </div>
  <div class="actions">
    <button id="sound" type="button" aria-pressed="false">Ativar som</button>
    <button id="vr" type="button" hidden>Entrar em VR</button>
  </div>
</header>
<div id="status">Carregando o jardim…</div>
<footer class="bottom">
  <span class="hint">Arraste para olhar · WASD ou setas para andar · Q/E sobe e desce · no óculos, use os controles</span>
</footer>

<script>
addEventListener('error',e=>{const el=document.getElementById('status'); if(el){el.hidden=false; el.textContent='Erro: '+(e.message||'falha ao carregar');}});
addEventListener('unhandledrejection',e=>{const el=document.getElementById('status'); if(el){el.hidden=false; el.textContent='Erro: '+((e.reason&&e.reason.message)||e.reason);}});
</script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.3.1/dist/spark.module.js"
}}
</script>
<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh, SparkControls, SparkXr, dyno } from "@sparkjsdev/spark";

const WORLDS=[
  {id:'jardim',name:'Jardim',file:'jardim.spz.wasm'}
];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const statusEl=document.getElementById('status');

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050704);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.02,200);
const rig=new THREE.Group(); scene.add(rig); rig.add(camera);
const spark=new SparkRenderer({renderer}); rig.add(spark);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ---------- animação dos splats: vento nas plantas, brilho pulsando, presença ----------
const T=dyno.dynoFloat(0), CAM=dyno.dynoVec3(new THREE.Vector3()), GROUND=dyno.dynoFloat(1.5), AMP=dyno.dynoFloat(reduce?0.02:0.06);
function makeModifier(){
  return dyno.dynoBlock({gsplat:dyno.Gsplat},{gsplat:dyno.Gsplat},({gsplat})=>{
    const d=new dyno.Dyno({
      inTypes:{gsplat:dyno.Gsplat,t:'float',cam:'vec3',ground:'float',amp:'float'},
      outTypes:{gsplat:dyno.Gsplat},
      globals:()=>[dyno.unindent(`
        float h1(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
      `)],
      statements:({inputs,outputs})=>dyno.unindentLines(`
        ${outputs.gsplat} = ${inputs.gsplat};
        vec3 p = ${inputs.gsplat}.center;
        float t = ${inputs.t};
        float h = clamp((p.y - ${inputs.ground}) / 2.2, 0.0, 1.0);
        float dCam = distance(p.xz, ${inputs.cam}.xz);
        float near = 1.0 - smoothstep(0.4, 3.5, dCam);
        float rnd = h1(floor(p * 4.0));
        float amp = ${inputs.amp} * h * h * (1.0 + 2.0 * near);
        vec3 off = vec3(sin(t * 0.9 + p.y * 1.7 + p.x * 0.6 + rnd),
                        sin(t * 0.6 + p.x * 1.1) * 0.35,
                        cos(t * 0.75 + p.y * 1.3 + p.z * 0.5 + rnd));
        ${outputs.gsplat}.center = p + off * amp;
        vec3 c = ${inputs.gsplat}.rgba.rgb;
        float lum = dot(c, vec3(0.299, 0.587, 0.114));
        float pink = smoothstep(0.06, 0.25, c.r - c.g) * smoothstep(0.0, 0.2, c.b - c.g * 0.5);
        float bright = smoothstep(0.55, 0.9, lum);
        float glow = max(pink, bright);
        float pulse = 0.5 + 0.5 * sin(t * 1.4 + rnd * 6.2831);
        float breathe = 1.0 + 0.08 * sin(t * 0.5 + p.x * 0.4 + p.z * 0.3);
        ${outputs.gsplat}.rgba.rgb = c * breathe * (1.0 + glow * pulse * 0.9 + near * 0.15);
      `)
    });
    gsplat=d.apply({gsplat,t:T,cam:CAM,ground:GROUND,amp:AMP}).gsplat;
    return {gsplat};
  });
}

let current=null, currentId=null;
async function loadWorld(w){
  statusEl.textContent='Carregando '+w.name.toLowerCase()+'…'; statusEl.hidden=false;
  document.querySelectorAll('[data-world]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.world===w.id)));
  if(current){scene.remove(current); current.dispose?.(); current=null;}
  currentId=w.id;
  let mesh;
  try{
    const res=await fetch(w.file); if(!res.ok) throw new Error(res.status);
    const buf=await res.arrayBuffer();
    if(currentId!==w.id) return;
    mesh=new SplatMesh({fileBytes:buf,fileType:'spz',fileName:w.id+'.spz'});
    scene.add(mesh); current=mesh;
    await mesh.initialized;
    if(currentId!==w.id) return;
    // estima a altura do chão perto da origem (eixo Y para cima)
    const ys=[]; let i=0;
    mesh.forEachSplat((idx,c)=>{ if((i++ & 15)===0 && c.x*c.x+c.z*c.z<9) ys.push(c.y); });
    ys.sort((a,b)=>a-b);
    GROUND.value = ys.length? ys[Math.floor(ys.length*0.1)] : 0;
    mesh.objectModifier=makeModifier(); mesh.updateGenerator();
    flies.position.y=GROUND.value; sky.position.y=GROUND.value;
    camera.position.set(0,0,0); camera.rotation.set(0,0,0); rig.position.set(0,GROUND.value+1.6,0); rig.quaternion.identity();
    statusEl.hidden=true;
  }catch(e){ statusEl.textContent='Não consegui abrir '+w.name.toLowerCase()+': '+(e&&e.message||e); }
}

// ---------- objetos de neon no céu ----------
function glowTex(){const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const r=g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.25,'rgba(255,255,255,.55)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,128,128); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;}
const GLOW=glowTex();
const NEON=[0xb8f23c,0xff4fd8,0xff6b2c,0x4ff0ff,0x9a6bff,0xfff06a];
const sky=new THREE.Group(); scene.add(sky);
const floaters=[];
function halo(color,size,op){const h=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false})); h.scale.setScalar(size); return h;}
const fine=(c,op)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
for(let i=0;i<42;i++){
  const color=NEON[i%NEON.length]; const r=Math.random(); let o, kind;
  if(r<0.55){ // orbe de luz pequeno
    kind=0; o=new THREE.Group(); o.add(new THREE.Mesh(new THREE.SphereGeometry(0.05+Math.random()*0.06,12,8),fine(color,.95))); o.add(halo(color,0.6+Math.random()*0.5,.5));
  } else if(r<0.85){ // medusa de neon pequena
    kind=1; o=new THREE.Group(); const s=0.25+Math.random()*0.2;
    const bell=new THREE.Mesh(new THREE.SphereGeometry(s,24,10,0,Math.PI*2,0,Math.PI/2),fine(color,.22)); o.add(bell);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(s,0.006,4,48),fine(color,.9)); rim.rotation.x=Math.PI/2; o.add(rim);
    for(let k=0;k<9;k++){const a=k/9*Math.PI*2; const pts=[]; for(let q=0;q<14;q++)pts.push(new THREE.Vector3(Math.cos(a)*s*0.8,-q*s*0.22,Math.sin(a)*s*0.8));
      const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color,transparent:true,opacity:.45,blending:THREE.AdditiveBlending})); ln.userData.tent={pts,a,r:s*0.8}; o.add(ln);}
    o.add(halo(color,s*4,.25));
  } else { // anel fino
    kind=2; o=new THREE.Group(); const s=0.3+Math.random()*0.4; o.add(new THREE.Mesh(new THREE.TorusGeometry(s,0.008,4,64),fine(color,.85))); o.add(halo(color,s*3,.18));
  }
  const rad=5+Math.random()*16, ang=Math.random()*Math.PI*2;
  o.position.set(Math.cos(ang)*rad, 4.5+Math.random()*8, Math.sin(ang)*rad);
  o.userData={base:o.position.clone(),seed:Math.random()*100,spin:(Math.random()-.5)*.4,kind};
  sky.add(o); floaters.push(o);
}
// vaga-lumes perto do chão
const FN=reduce?120:360, fg=new THREE.BufferGeometry(), fp=new Float32Array(FN*3), fs=new Float32Array(FN);
for(let i=0;i<FN;i++){const r=Math.sqrt(Math.random())*9, a=Math.random()*Math.PI*2; fp.set([Math.cos(a)*r,0.15+Math.random()*2.5,Math.sin(a)*r],i*3); fs[i]=Math.random()*100;}
fg.setAttribute('position',new THREE.BufferAttribute(fp,3));
const flies=new THREE.Points(fg,new THREE.PointsMaterial({map:GLOW,color:0xd6ff7a,size:0.12,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(flies);

// ---------- controles ----------
const controls=new SparkControls({canvas:renderer.domElement});
const vrBtn=document.getElementById('vr');
let sxr=null;
try{
  sxr=new SparkXr({renderer,element:vrBtn,mode:'vr',referenceSpaceType:'local-floor',
    onReady:(ok)=>{vrBtn.hidden=!ok;},
    onEnterXr:()=>{vrBtn.textContent='Sair do VR';},
    onExitXr:()=>{vrBtn.textContent='Entrar em VR';}
  });
}catch(e){vrBtn.hidden=true;}

// ---------- som ----------
const soundBtn=document.getElementById('sound'); let actx=null;
function startAudio(){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  const master=actx.createGain(); master.gain.value=0; master.connect(actx.destination); master.gain.linearRampToValueAtTime(.45,actx.currentTime+3);
  [[55,'sawtooth'],[82.4,'triangle'],[110.2,'sine'],[164.8,'sine']].forEach(([f,type],i)=>{
    const o=actx.createOscillator(); o.type=type; o.frequency.value=f;
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500+i*200; lp.Q.value=5;
    const lfo=actx.createOscillator(), lg=actx.createGain(); lfo.frequency.value=.04+i*.03; lg.gain.value=300; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const g=actx.createGain(); g.gain.value=i<2?.12:.05; o.connect(lp); lp.connect(g); g.connect(master); o.start();
  });
  // pequenos sinos aleatórios, como as luzes acendendo
  setInterval(()=>{ if(actx.state!=='running')return; const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=[659,784,988,1175,1319][Math.floor(Math.random()*5)];
    g.gain.value=0; g.gain.linearRampToValueAtTime(.05,actx.currentTime+.05); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+3);
    const p=actx.createStereoPanner(); p.pan.value=Math.random()*2-1; o.connect(g); g.connect(p); p.connect(master); o.start(); o.stop(actx.currentTime+3.1); }, 1700);
}
soundBtn.addEventListener('click',()=>{
  if(!actx){startAudio(); soundBtn.setAttribute('aria-pressed','true'); soundBtn.textContent='Som ligado'; return;}
  if(actx.state==='running'){actx.suspend(); soundBtn.setAttribute('aria-pressed','false'); soundBtn.textContent='Ativar som';}
  else{actx.resume(); soundBtn.setAttribute('aria-pressed','true'); soundBtn.textContent='Som ligado';}
});

// ---------- loop ----------
const camW=new THREE.Vector3(), tmp=new THREE.Vector3();
renderer.setAnimationLoop((time)=>{
  const t=time/1000*(reduce?.3:1);
  if(renderer.xr.isPresenting){ sxr?.updateControllers(camera); }
  else controls.update(camera);
  camera.getWorldPosition(camW);
  if(current){ T.value=t; tmp.copy(camW); current.worldToLocal(tmp); CAM.value.copy(tmp); current.updateVersion(); }
  floaters.forEach(o=>{const u=o.userData;
    o.position.set(u.base.x+Math.sin(t*.08+u.seed)*1.2, u.base.y+Math.sin(t*.3+u.seed)*0.5, u.base.z+Math.cos(t*.07+u.seed)*1.2);
    o.rotation.y+=u.spin*0.01; if(u.kind===2) o.rotation.x=Math.sin(t*.25+u.seed)*.8;
    const pulse=.6+.4*Math.sin(t*1.1+u.seed);
    o.children.forEach(c=>{ if(c.isSprite) c.material.opacity=(u.kind===0?.5:.22)*pulse;
      if(c.userData.tent){const {pts,a,r}=c.userData.tent; pts.forEach((p,q)=>{const w=Math.sin(t*1.3+q*.45+u.seed)*0.012*q; p.x=Math.cos(a)*r+w; p.z=Math.sin(a)*r+w*.6;}); c.geometry.setFromPoints(pts);} });
    if(u.kind===1){ const sc=1+0.06*Math.sin(t*1.6+u.seed); o.scale.set(sc,1/sc,sc); }
  });
  const pa=fg.attributes.position.array;
  for(let i=0;i<FN;i++){const s=fs[i]; pa[i*3]+=Math.sin(t*.7+s)*.004; pa[i*3+1]+=Math.cos(t*.9+s*1.3)*.003; pa[i*3+2]+=Math.sin(t*.5+s*2.1)*.004;
    const dx=camW.x-pa[i*3], dz=camW.z-pa[i*3+2], d=Math.hypot(dx,dz); if(d<3&&d>.6){pa[i*3]+=dx*.002; pa[i*3+2]+=dz*.002;}}
  fg.attributes.position.needsUpdate=true; flies.material.size=.1+.04*Math.sin(t*2);
  renderer.render(scene,camera);
});

loadWorld(WORLDS[0]);
</script>
