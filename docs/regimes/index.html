const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a20, roughness: .92 });

function glowTexture() { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.4, "rgba(255,255,255,.35)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); }

{

  }

  person(x0 + 2.6, -.2, 1.74, 0x07070a, false, .3); person(x0 + 1.5, -2.1, 1.25, 0x07070a); person(x0 + 4.0, 2.1, 1.25, 0x07070a); person(x0 + 4.6, -2.0, 1.25, 0x07070a);
}
// ---------- ROOM 2: red regime (rest)
const r2 = { spots: [], mats: [], haze: null };
{
  const x0 = X(2);

  const cushMat = new THREE.MeshStandardMaterial({ color: 0x5a1c18, roughness: 1 });

    const p = new THREE.Mesh(new RoundedBoxGeometry(2.0, .35, 1.9, 4, .08), platMat); p.position.set(x0 + bx + 1.0, .175, bz + .95); p.castShadow = p.receiveShadow = true; scene.add(p);
    for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new RoundedBoxGeometry(.7, .22, .5, 4, .1), cushMat); c.position.set(x0 + bx + .4 + k * .62, .45, bz + .3 + (k % 2) * .9); c.rotation.y = (k - 1) * .4; c.castShadow = true; scene.add(c); }

const r3 = { beams: [], haze: null };
{
  const x0 = X(3);
  const defs = [[.4, -2.6, BLUE, 0], [5.6, -2.6, RED, 1.4], [.4, 2.6, RED, 2.8], [5.6, 2.6, BLUE, 4.2]];

// ---------- views
const VIEWS = [
  { pos: [X(0) + .4, 1.6, 1.6], tgt: [X(0) + RM - .5, 1.4, -.8] },
  { pos: [X(1) + .4, 1.6, -.4], tgt: [X(1) + RM - .5, 1.3, 0] },
  { pos: [X(2) + .5, 1.55, -2.4], tgt: [X(2) + RM - .6, .7, .6] },
  { pos: [X(3) + .3, 1.6, -.2], tgt: [X(3) + RM - .5, 1.6, .2] },
  { pos: [L / 2, 17, 11.5], tgt: [L / 2, 0, 0] } ];
let fly = null;
function goRoom(i, instant = false) {
  room = i; document.querySelectorAll("#rooms [data-r]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.r === i)));
  document.getElementById("balRow").hidden = i !== 3; document.getElementById("sndRow").hidden = i !== 0; applyLang();
  const v = VIEWS[i]; const to = { p: new THREE.Vector3(...v.pos), t: new THREE.Vector3(...v.tgt) };

document.querySelectorAll("#rooms [data-r]").forEach(b => b.addEventListener("click", () => { stopTour(); goRoom(+b.dataset.r); }));
// tour: walks through the three rooms, staying in each
let tour = null;
const tourBtn = document.getElementById("tour");
function stopTour() { tour = null; tourBtn.setAttribute("aria-pressed", "false"); }
tourBtn.addEventListener("click", () => { if (tour) return stopTour(); tour = { i: 0, t0: performance.now() }; tourBtn.setAttribute("aria-pressed", "true"); goRoom(0); });
const bal = document.getElementById("bal");

// ---------- animate: every change is slow (minimum 2 s); nothing flashes
const clock = new THREE.Clock(); let tSim = 0;
function frame() {

addEventListener("resize", resize); resize();
